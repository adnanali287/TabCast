<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabCast</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="popup">
    <main>
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M7 19v-6h5l7-6v18l-7-6H7Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
          <path d="M23 12c1.4 1.1 2 2.4 2 4s-.6 2.9-2 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <div>
          <h1>TabCast</h1>
          <p id="tabTitle">Checking active tab...</p>
        </div>
      </div>
      <button id="openStreamer" type="button">Open streamer</button>
      <p class="hint">Open this from the tab you want to listen to.</p>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
